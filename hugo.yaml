  # About
  about:
    enable: true
    title: "About Me"
#    image: "/images/me.png"
    content: |-
      I am an interdisciplinary scientist working at the intersection of 
      **developmental science**, **wearable biosensing**, and **human-centered 
      computing**. My research integrates nonlinear and multivariate 
      time series analysis with multimodal behavioral measurement using 
      computer vision and accelerometry. I have a strong interest in 
      developing digital music-based interventions for autism.  
      
      I received my PhD in Personal Health Informatics from the Khoury 
      College of Computer Sciences at Northeastern University in Dec 2025.  
      
      I am currently a Research Associate at Northeastern University 
      in Boston, MA and **looking for postdoctoral research opportunities**.
